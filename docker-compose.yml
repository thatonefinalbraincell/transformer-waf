version: '3.8'

services:
  # 1. AI Web Application Firewall & Console
  waf-service:
    build: .
    container_name: transformer_waf
    restart: always
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - UPSTREAM_HOST=mock-upstream
      - UPSTREAM_PORT=8080
      - MALICIOUS_THRESHOLD=0.75
      - DATABASE_URL=sqlite:////app/backend/waf.db
    volumes:
      - waf_data:/app/backend
    depends_on:
      - mock-upstream

  # 2. Mock Upstream Target Web Application (Protected Backend)
  mock-upstream:
    build: .
    container_name: mock_upstream_target
    restart: always
    command: ["python", "-m", "proxy.mock_upstream"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

volumes:
  waf_data:
